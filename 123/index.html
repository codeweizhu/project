function placeTrain(){
  const tr = $app.querySelector(".train"); if (!tr) return;
  const to = state.day;
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (trainAt === null || trainAt === to || reduce){
    tr.classList.toggle("rev", trainRev); tr.style.transform = `translateX(${to * 100}%)`; trainAt = to; return;
  }
  const from = trainAt; trainAt = to; trainRev = to < from;
  tr.classList.toggle("rev", trainRev);
  tr.style.transition = "none"; tr.style.transform = `translateX(${from * 100}%)`;
  tr.getBoundingClientRect();
  tr.style.transition = "";
  requestAnimationFrame(() => { tr.classList.add("go"); tr.style.transform = `translateX(${to * 100}%)`; });
  tr.addEventListener("transitionend", () => tr.classList.remove("go"), {once:true});
}

async function copyText(txt){

let stageFocus = null;

function fitStage(st){
  const sc = st.querySelector(".stage-scroll"), inner = st.querySelector(".stage-inner");
  const big = inner.querySelector(".big"), small = inner.querySelector(".small");
  const cs = getComputedStyle(sc);
  const avail = sc.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const maxPx = Math.min(56, Math.max(30, window.innerWidth * 0.088)), minPx = 22;
  const apply = px => { big.style.fontSize = px + "px"; if (small) small.style.fontSize = Math.max(18, px * 0.72) + "px"; };
  const fits = () => inner.getBoundingClientRect().height <= avail;
  apply(maxPx); if (fits()) return;
  let lo = minPx, hi = maxPx;
  for (let i = 0; i < 12; i++){ const mid = (lo + hi) / 2; apply(mid); if (fits()) lo = mid; else hi = mid; }
  apply(lo);
}
function showStage(p){
  closeStage(); stageFocus = document.activeElement;

  const x = p.extra || {};

  st.setAttribute("role","dialog"); st.setAttribute("aria-modal","true"); st.setAttribute("aria-label","放大顯示");

  document.body.appendChild(st); document.body.classList.add("locked");
  fitStage(st);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (st.isConnected) fitStage(st); });
  st.querySelector(".stage-close").focus();
}
window.addEventListener("resize", () => { const st = document.querySelector(".stage"); if (st) fitStage(st); });

function saveForm(s){
  const g = n => norm(s.querySelector(`[name="${n}"]`).value);
  const when = g("when"), ja = g("ja"), zh = g("zh"), xja = g("xja"), xzh = g("xzh");
  const err = s.querySelector(".err");
  const miss = [!when && "使用情境／標題", !ja && "日文", !zh && "中文"].filter(Boolean);
  if (miss.length){ err.textContent = `請填寫：${miss.join("、")}。`; return; }
  if (xzh && !xja){ err.textContent = "填了補充中文，也請填補充日文。"; return; }
  const list = loadCustom(), id = s.dataset.id, now = new Date().toISOString();
  const rec = {id: id || newId(), when, ja, zh, ...(xja ? {extra:{ja:xja, zh:xzh}} : {}), createdAt: now, updatedAt: now};
  if (list.some(p => p.id !== rec.id && keyOf(p) === keyOf(rec))){ err.textContent = "已經有一張標題、日文、中文都相同的小抄。"; return; }
  if (id){
    const i = list.findIndex(p => p.id === id);
    if (i < 0){ err.textContent = "找不到這張小抄，可能已經被刪除。"; return; }
    rec.createdAt = list[i].createdAt || now; list[i] = rec;
  } else list.push(rec);
  if (!saveCustom(list)){ err.textContent = "這個瀏覽器現在無法儲存（可能是無痕模式或儲存空間已滿）。"; return; }
  closeSheet(); render(); toast(id ? "已更新" : "已新增");
}

  pendingImport = null;
  openSheet(`<h3>匯入自訂小抄</h3>
    <p class="note">選擇之前匯出的 JSON 檔，或把內容貼在下面。會合併進現有的自訂小抄，不會覆蓋。</p>
    <label class="btn filebtn">選擇 JSON 檔<input type="file" accept=".json,application/json,text/plain" data-file hidden></label>
    <textarea class="code" rows="6" data-paste placeholder="或把 JSON 內容貼在這裡"></textarea>
    <p class="err" role="status"></p>
    <div class="sheet-acts"><button class="btn" data-cancel>取消</button><button class="btn" data-check>檢查內容</button><button class="btn fill" data-doimport disabled>確認匯入</button></div>`, "匯入自訂小抄");
}
function analyzeImport(text){
  let raw; try{ raw = JSON.parse(text); }catch(e){ return {error:"看不懂這段內容，請確認是從這裡匯出的 JSON。"}; }
  let arr;
  if (Array.isArray(raw)) arr = raw;                       // 相容：直接貼 phrases 陣列
  else if (raw && typeof raw === "object"){                // 完整備份格式：檢查 type / version，不限制 edition
    if (raw.type !== "kyoto26-custom-phrases") return {error:"這不是京都旅行日文小抄的備份檔。"};
    if (raw.version !== 1) return {error:"這個備份版本目前無法匯入。"};
    if (!Array.isArray(raw.phrases)) return {error:"這個備份檔裡找不到小抄資料。"};
    arr = raw.phrases;
  } else return {error:"這不是京都旅行日文小抄的備份檔。"};
  const cur = loadCustom(), ids = new Set(cur.map(p => p.id)), keys = new Set(cur.map(keyOf)), builtin = new Set(DATA.phrases.map(p => p.id));
  const add = []; let dup = 0, bad = 0; const now = new Date().toISOString();
  for (const it of arr){
    if (!it || typeof it !== "object"){ bad++; continue; }
    const rec = {id: norm(it.id), when: norm(it.when ?? it.title), ja: norm(it.ja), zh: norm(it.zh)};
    if (!rec.when || !rec.ja || !rec.zh || rec.when.length > 60 || rec.ja.length > 400 || rec.zh.length > 400){ bad++; continue; }
    if ((rec.id && ids.has(rec.id)) || keys.has(keyOf(rec))){ dup++; continue; }
    if (!rec.id || builtin.has(rec.id)) rec.id = newId();
    const xja = norm(it.extra && it.extra.ja), xzh = norm(it.extra && it.extra.zh);
    if (xja.length > 400 || xzh.length > 400){ bad++; continue; }
    if (xja) rec.extra = {ja:xja, zh:xzh};
    rec.createdAt = norm(it.createdAt) || now; rec.updatedAt = now;
    ids.add(rec.id); keys.add(keyOf(rec)); add.push(rec);
  }
  return {add, dup, bad};
}
function checkImport(s, text){
  const msg = s.querySelector(".err"), go = s.querySelector("[data-doimport]");
  const r = analyzeImport(text); pendingImport = null; go.disabled = true; msg.classList.remove("ok");
  if (r.error){ msg.textContent = r.error; return; }
  msg.textContent = `準備新增 ${r.add.length} 張，略過 ${r.dup} 張重複內容` + (r.bad ? `，另有 ${r.bad} 張格式不完整` : "") + "。";
  msg.classList.add("ok");
  if (r.add.length){ pendingImport = r.add; go.disabled = false; }
}


/* v2：總覽頁旅程封面卡（只讀 DATA，不改資料） */
function coverCard(){
  const parts = String(DATA.trip.sub || "").split("｜");
  const stay = (parts.find(s => s.startsWith("住宿：")) || "").replace("住宿：", "");
  const first = DATA.days[0].date.split("-"), last = DATA.days[DATA.days.length - 1].date.split("-");
  const info = parts.filter(s => /天|人/.test(s) && !s.startsWith("住宿：")).join("｜");
  const at = todayIdx >= 0 ? todayIdx : 0;
  const stops = DATA.days.map(d => { const [, m, dd] = d.date.split("-"); return `<span style="--c:${d.color}">${+m}/${+dd}</span>`; }).join("");
  return `<div class="cover">
    <h2>${esc(DATA.trip.title)}</h2>
    <div class="range">${first[0]}/${first[1]}/${first[2]} → ${+last[1]}/${+last[2]}</div>
    <div class="meta">${esc(info)}${stay ? `<br>住宿：<b>${esc(stay)}</b>` : ""}</div>
    <div class="mini" style="--n:${DATA.days.length}" aria-hidden="true"><div class="ln"></div>
      <div class="ct" style="transform:translateX(${at * 100}%)">${TRAIN}</div>${stops}</div>
  </div>`;
}

function stCls(s){ return /完成/.test(s) ? "done" : /待處理/.test(s) ? "todo" : /待確認/.test(s) ? "check" : "other"; }
function infoView(){
  setLine({color:"#2F5D9E", colorDark:"#7FA6E0"});
  const conf = DATA.confirmed.map(c => `<li><div class="k">${esc(c.k)}</div><div class="v">${esc(c.v)}</div>${c.note ? `<div class="m">${esc(c.note)}</div>` : ""}</li>`).join("");
  const book = DATA.bookings.map(b => `<li><div class="k">${esc(b.k)}<span class="st ${stCls(b.st)}">${esc(b.st)}</span></div><div class="v">${esc(b.v)}</div></li>`).join("");
  const todo = DATA.todos.map(t => `<li><div class="k">${esc(t.when)}<span class="st ${stCls(t.st)}">${esc(t.st)}</span></div><div class="v">${esc(t.what)}</div>${t.note ? `<div class="m">${esc(t.note)}</div>` : ""}</li>`).join("");
  const theme = store.get("theme", "auto");
  return `<section class="sec">
    ${coverCard()}
    ${DATA.meta && DATA.meta.dataVersion ? `<p class="note">行程資料：${esc(DATA.meta.dataVersion)}</p>` : ""}
    <h2>航班、交通與飲食</h2><ul class="kv">${conf}</ul>
    <h2>預約</h2><ul class="kv">${book}</ul>
    <h2>出發前待辦</h2><ul class="kv">${todo}</ul>
    <p class="privacy">預約號碼、QR 和票券都留在手機裡，這個頁面不放。</p>
    <div class="chips theme" role="group" aria-label="外觀">
      <button class="chip" data-theme="auto" aria-pressed="${theme === "auto"}">跟隨手機</button>
      <button class="chip" data-theme="light" aria-pressed="${theme === "light"}">淺色</button>
      <button class="chip" data-theme="dark" aria-pressed="${theme === "dark"}">深色</button>
    </div></section>`;
}

function applyTheme(t){
  const r = document.documentElement;
  if (t === "light" || t === "dark") r.setAttribute("data-theme", t); else r.removeAttribute("data-theme");
}

function render(){
  NOW = jstNow(); todayIdx = DATA.days.findIndex(d => d.date === NOW.date);
  $app.innerHTML = state.view === "pay" ? payView() : state.view === "info" ? infoView() : state.view === "ja" ? jaView() : state.view === "sos" ? sosView() : planView();
  document.querySelectorAll(".nav button").forEach(b => { if (b.dataset.view === state.view) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  placeTrain();
  $app.insertAdjacentHTML("beforeend", `<footer class="page-footer">KYOTO · 2026 / 10 / 22 – 10 / 27</footer>`);
}

document.addEventListener("keydown", e => { if (e.key === "Escape"){ if (document.querySelector(".stage")) closeStage(); else closeSheet(); } });
document.addEventListener("change", e => {
  const f = e.target.closest("[data-file]"); if (!f || !f.files || !f.files[0]) return;
  const s = f.closest(".sheet"), rd = new FileReader();
  rd.onload = () => { s.querySelector("[data-paste]").value = String(rd.result || ""); checkImport(s, String(rd.result || "")); };
  rd.onerror = () => { s.querySelector(".err").textContent = "讀不到這個檔案，請改用貼上 JSON。"; };
  rd.readAsText(f.files[0]);
});
document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.hasAttribute("data-close")){ closeStage(); return; }
  if (t.dataset.copy !== undefined){
    const p = findPhrase(t.dataset.copy); if (!p) return;
    copyText(t.dataset.part === "extra" ? p.extra.ja : p.ja).then(ok => toast(ok ? "已複製" : "複製失敗，請長按文字選取"));
    return;
  }
  if (t.dataset.show !== undefined){ const p = findPhrase(t.dataset.show); if (p) showStage(p); return; }
  if (t.hasAttribute("data-add")){ formSheet(null); return; }
  if (t.dataset.edit !== undefined){ const p = loadCustom().find(x => x.id === t.dataset.edit); if (p) formSheet(p); return; }
  if (t.dataset.del !== undefined){ const p = loadCustom().find(x => x.id === t.dataset.del); if (p) deleteSheet(p); return; }
  if (t.hasAttribute("data-cancel")){ closeSheet(); return; }
  if (t.hasAttribute("data-save")){ saveForm(t.closest(".sheet")); return; }
  if (t.dataset.confirmDel !== undefined){
    const list = loadCustom().filter(x => x.id !== t.dataset.confirmDel);
    if (!saveCustom(list)){ toast("刪除失敗：這個瀏覽器現在無法儲存"); return; }
    closeSheet(); render(); toast("已刪除"); return;
  }
  if (t.hasAttribute("data-export")){ exportSheet(); return; }
  if (t.hasAttribute("data-copyjson")){
    const s = t.closest(".sheet");
    copyText(s.querySelector("[data-json]").value).then(ok => { s.querySelector(".err").textContent = ok ? "已複製，可以貼到記事本或傳給自己保存。" : "複製失敗，請長按上面的內容全選複製。"; });
    return;
  }
  if (t.hasAttribute("data-dl")){
    const s = t.closest(".sheet"), msg = s.querySelector(".err"), d = new Date();
    const name = `kyoto26-custom-phrases-${EDITION}-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`;
    saveFile(name, s.querySelector("[data-json]").value).then(r => {
      msg.textContent = r === "saved" ? "已交給瀏覽器下載。" : r === "declined" ? "已取消下載。" : r === "rate_limited" ? "下載視窗還開著，請稍後再試。" : "這裡無法下載檔案，請改用「複製 JSON」。";
    });
    return;
  }
  if (t.hasAttribute("data-import")){ importSheet(); return; }
  if (t.hasAttribute("data-check")){ const s = t.closest(".sheet"); checkImport(s, s.querySelector("[data-paste]").value); return; }
  if (t.hasAttribute("data-doimport")){
    if (!pendingImport || !pendingImport.length) return;
    const n = pendingImport.length;
    if (!saveCustom([...loadCustom(), ...pendingImport])){ t.closest(".sheet").querySelector(".err").textContent = "匯入失敗：這個瀏覽器現在無法儲存。"; return; }
    pendingImport = null; closeSheet(); render(); toast(`已匯入 ${n} 張`); return;
  }
  if (t.dataset.view){ state.view = t.dataset.view; store.set("view", state.view); render(); window.scrollTo(0,0); return; }
  if (t.dataset.day !== undefined){ state.day = +t.dataset.day; state.open.clear(); state.sumOpen = false; store.set("day", state.day); render(); window.scrollTo(0,0); return; }
  if (t.dataset.open !== undefined){ const i = +t.dataset.open; state.open.has(i) ? state.open.delete(i) : state.open.add(i); render(); return; }
  if (t.hasAttribute("data-sum")){ state.sumOpen = !state.sumOpen; render(); return; }
  if (t.dataset.pay){ state.payFilter = t.dataset.pay; store.set("payFilter", state.payFilter); render(); return; }
  if (t.dataset.theme){ store.set("theme", t.dataset.theme); applyTheme(t.dataset.theme); render(); return; }
});

applyTheme(store.get("theme", "auto"));
render();
if (state.view === "plan" && todayIdx >= 0){
  const now = $app.querySelector(".stop.now");
  if (now) now.scrollIntoView({block:"center"});
}

// Keep import confirmation bound to the current draft.
document.addEventListener("input", e => {
  if (!e.target.matches("[data-paste]")) return;
  pendingImport = null;
  const sheet = e.target.closest(".sheet");
  sheet.querySelector("[data-doimport]").disabled = true;
  sheet.querySelector(".err").textContent = "內容已變更，請重新檢查。";
});
// Keyboard focus remains inside the active dialog.
document.addEventListener("keydown", e => {
  if(e.key !== "Tab") return;
  const dialog = document.querySelector(".stage, .sheet");
  if(!dialog) return;
  const nodes = [...dialog.querySelectorAll("button:not(:disabled),input:not([hidden]),textarea,a[href]")];
  if(!nodes.length) return;
  const first=nodes[0], last=nodes[nodes.length-1];
  if(e.shiftKey && document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey && document.activeElement===last){e.preventDefault();first.focus();}
});
// Refresh the trip's local time after returning to this tab.
document.addEventListener("visibilitychange", () => {
  if(!document.hidden && state.view === "plan" && !document.querySelector("[role=dialog]")) render();
});
if(document.modelContext?.registerTool){
  const lifecycle = new AbortController();
  try { Promise.resolve(document.modelContext.registerTool({
    name:"navigate_trip_day",title:"查看每日行程",
    description:"切換到指定日期的京都行程，不修改行程資料。",
    inputSchema:{type:"object",properties:{date:{type:"string",enum:DATA.days.map(d=>d.date)}},required:["date"],additionalProperties:false},
    annotations:{readOnlyHint:false,untrustedContentHint:false},
    execute(input){
      const index=DATA.days.findIndex(d=>d.date===input?.date);
      if(index<0) throw new Error("日期不在旅程內");
      state.view="plan";state.day=index;state.open.clear();state.sumOpen=false;
      store.set("view","plan");store.set("day",index);render();window.scrollTo(0,0);
      return {date:DATA.days[index].date,title:DATA.days[index].title,items:DATA.days[index].items.length};
    }
  },{signal:lifecycle.signal})).catch(()=>{}); } catch {}
}

</script>
